<!doctype html>
<html lang="zh-Hans" data-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Line Icon Preview</title>
    <style>
        :root {
            color-scheme: light;
            --preview-bg: #f4f6f8;
            --preview-surface: #ffffff;
            --preview-text: #17202a;
            --preview-muted: #637083;
            --preview-border: #d7dde5;
            --preview-soft: #eef2f6;
            --preview-shadow: 0 1px 2px rgba(16, 24, 40, 0.08);
        }

        html[data-theme='dark'] {
            color-scheme: dark;
            --preview-bg: #15181d;
            --preview-surface: #1f242b;
            --preview-text: #eef2f6;
            --preview-muted: #aeb8c5;
            --preview-border: #3b4652;
            --preview-soft: #2a3038;
            --preview-shadow: none;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-width: 920px;
            background: var(--preview-bg);
            color: var(--preview-text);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 14px;
            letter-spacing: 0;
        }

        .page {
            width: min(1180px, calc(100vw - 32px));
            margin: 0 auto;
            padding: 20px 0 32px;
        }

        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 14px;
        }

        h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 760;
            line-height: 1.2;
        }

        .toolbar-actions {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .theme-button {
            min-width: 64px;
            height: 32px;
            padding: 0 12px;
            border: 1px solid var(--preview-border);
            border-radius: 6px;
            background: var(--preview-surface);
            color: var(--preview-text);
            font: inherit;
            cursor: pointer;
        }

        .theme-button[aria-pressed='true'] {
            background: var(--preview-text);
            border-color: var(--preview-text);
            color: var(--preview-surface);
        }

        .preview-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            overflow: hidden;
            background: var(--preview-surface);
            border: 1px solid var(--preview-border);
            border-radius: 8px;
            box-shadow: var(--preview-shadow);
        }

        .preview-table th,
        .preview-table td {
            padding: 11px 12px;
            border-bottom: 1px solid var(--preview-border);
            text-align: left;
            vertical-align: middle;
        }

        .preview-table th {
            position: sticky;
            top: 0;
            z-index: 1;
            background: var(--preview-soft);
            color: var(--preview-muted);
            font-size: 12px;
            font-weight: 720;
        }

        .preview-table tr:last-child td {
            border-bottom: 0;
        }

        .company-name {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 180px;
        }

        .company-key,
        .sample-meta,
        .design-meta {
            color: var(--preview-muted);
            font-size: 12px;
            line-height: 1.25;
        }

        .icon-slot,
        .badge-slot {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 72px;
            min-height: 44px;
            padding: 6px;
            border: 1px dashed var(--preview-border);
            border-radius: 6px;
            background: color-mix(in srgb, var(--preview-surface) 80%, var(--preview-soft));
        }

        .placeholder {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 42px;
            min-height: 24px;
            padding: 0 7px;
            border: 1px solid var(--preview-border);
            border-radius: 5px;
            color: var(--preview-muted);
            font-size: 11px;
            line-height: 1;
        }

        .sample-cell {
            min-width: 260px;
            max-width: 340px;
            color: var(--preview-text);
            font-size: 13px;
            line-height: 1.45;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <main class="page">
        <div class="toolbar">
            <h1>Line Icon / Station Badge Preview</h1>
            <div class="toolbar-actions" role="group" aria-label="Theme">
                <button class="theme-button" type="button" data-theme-value="light" aria-pressed="true">Light</button>
                <button class="theme-button" type="button" data-theme-value="dark" aria-pressed="false">Dark</button>
            </div>
        </div>

        <table class="preview-table">
            <thead>
                <tr>
                    <th>Company</th>
                    <th>Line Icon</th>
                    <th>Station Badge</th>
                    <th>Sample</th>
                    <th>Design</th>
                </tr>
            </thead>
            <tbody id="preview-body"></tbody>
        </table>
    </main>

    <script type="module" src="./src/debug/lineIconPreview.js"></script>
</body>
</html>
