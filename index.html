<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="utf-8" />
    <title>东京铁路网</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
    
    <!-- 1. 引入 MapLibre GL JS 的 CSS 和 JS -->
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    
    <style>
        :root {
            --custom-icon-font-size: 12px;
            --ui-text: #111;
            --ui-border: #e3e5e7;
        }

        html[data-theme='dark'] {
            --ui-text: #f2f2f2;
            --ui-border: #5a5d62;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        #map {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* 隐藏滚动条 */
        body::-webkit-scrollbar {
            display: none;
        }

        .custom-button {
            background-color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
            cursor: pointer !important;
            font-size: 18px;
        }

        .custom-button:hover {
            background-color: #f0f0f0;
        }

        .video-button{
            display: none;
        }

        .custom-textbox {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: white;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 17px;
            opacity: 0;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
            z-index:9999;
        }

        .custom-icon {
            font-size: var(--custom-icon-font-size);
            background-color: rgba(255, 255, 255, 0.8);
            padding: 0px;
            border-radius: 5px;
            color: #4e4e4e;
            text-align: center;
            white-space: nowrap;
            display: inline-block;
        }

        /* 左上角搜索框（仅 UI；逻辑在 search.js） */
        .search-ui {
            position: absolute;
            top: 10px;
            left: 20px;
            z-index: 9999;
            width: 320px;
            max-width: calc(100vw - 20px);
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            user-select: none;
            /* 动画：从圆形向右展开为圆角矩形（top/left 不变） */
            transition: width 0.2s ease;
            position: absolute;
            display: grid;
            grid-template-rows: 36.4px auto;
            grid-template-columns: 1fr;
            gap: 0;
        }

        /* 顶部“外壳”：负责圆形/圆角矩形形变（避免影响结果面板背景） */
        .search-ui::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            height: 36.4px;
            width: 100%;
            border-radius: 18.2px;
            background: rgba(255, 255, 255, 0.75);
            border: 1px solid #e3e5e7;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(4px);
            transition: border-radius 0.2s ease;
            pointer-events: none;
        }

        /* 初始：圆形搜索按钮；hover/触屏点击后展开为 search-bar */
        .search-ui.is-collapsed {
            width: 36.4px;
        }

        .search-ui.is-collapsed::before {
            /* 用“高度一半”的半径，避免从超大值被浏览器 clamp 导致末尾跳变 */
            border-radius: 18.2px;
        }

        .search-ui.is-collapsed .search-results {
            opacity: 0;
            max-height: 0;
            margin-top: 0;
            border-width: 0;
            pointer-events: none;
        }

        .search-fab {
            grid-row: 1;
            grid-column: 1;
            width: 100%;
            height: 36.4px;
            border-radius: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            box-shadow: none;
            backdrop-filter: none;
            cursor: pointer;
            padding: 0;
            margin: 0;
            color: #111;
            font-size: 18px;
            line-height: 1;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            z-index: 1;
        }

        .search-ui.is-collapsed .search-fab {
            opacity: 1;
            pointer-events: auto;
        }

        .search-fab-icon {
            width: 18px;
            height: 18px;
            display: block;
            pointer-events: none;
        }

        .search-fab:focus {
            outline: none;
        }

        .search-bar {
            grid-row: 1;
            grid-column: 1;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            border-radius: 12px;
            background: transparent;
            border: none;
            box-shadow: none;
            backdrop-filter: none;
            opacity: 1;
            transition: opacity 0.2s ease;
            z-index: 1;
        }

        .search-ui.is-collapsed .search-bar {
            opacity: 0;
            pointer-events: none;
        }

        .search-input {
            width: 100%;
            border: none;
            background: transparent;
            outline: none;
            font-size: 14px;
            color: #111;
        }

        .search-input::placeholder {
            color: #666;
        }

        .search-results {
            grid-row: 2;
            grid-column: 1;
            margin-top: 8px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.92);
            border-style: solid;
            border-color: #e3e5e7;
            border-width: 1px;
            box-shadow: 0 0 30px rgba(0, 0, 0, .1);
            overflow: hidden;
            opacity: 1;
            max-height: 360px;
            transition: opacity 0.2s ease, max-height 0.2s ease, margin-top 0.2s ease, border-width 0.2s ease;
        }

        .search-results.is-hidden {
            opacity: 0;
            max-height: 0;
            margin-top: 0;
            border-width: 0;
            pointer-events: none;
        }

        .search-results-list {
            list-style: none;
            margin: 0;
            padding: 4px 0;
            max-height: 320px;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .search-results-list::-webkit-scrollbar {
            display: none;
        }

        .settings-ui {
            position: absolute;
            top: 10px;
            right: 20px;
            z-index: 9999;
            width: 320px;
            max-width: calc(100vw - 20px);
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            user-select: none;
            transition: width 0.2s ease;
        }

        .settings-ui::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            height: 36.4px;
            width: 100%;
            border-radius: 18.2px;
            background: rgba(255, 255, 255, 0.75);
            border: 1px solid #e3e5e7;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(4px);
            transition: border-radius 0.2s ease, opacity 0.2s ease;
            pointer-events: none;
            opacity: 1;
        }

        .settings-ui.is-collapsed {
            width: 36.4px;
        }

        .settings-ui.is-collapsed::before {
            border-radius: 18.2px;
        }

        .settings-ui:not(.is-collapsed)::before {
            opacity: 0;
        }

        .settings-fab {
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 36.4px;
            border-radius: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            box-shadow: none;
            backdrop-filter: none;
            cursor: pointer;
            padding: 0;
            margin: 0;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            z-index: 1;
        }

        .settings-ui.is-collapsed .settings-fab {
            opacity: 1;
            pointer-events: auto;
        }

        .settings-fab-icon {
            width: 18px;
            height: 18px;
            display: block;
            pointer-events: none;
        }

        .settings-fab:focus {
            outline: none;
        }

        /* ===== 导出（截图）菜单：仿 settings-fab 的 hover 弹出 ===== */
        .export-ui {
            position: fixed;
            top: 10px;
            right: 104px;
            z-index: 9999;
            width: 260px;
            max-width: calc(100vw - 20px);
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            user-select: none;
            transition: width 0.2s ease;
        }

        .export-ui::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            height: 36.4px;
            width: 100%;
            border-radius: 18.2px;
            background: rgba(255, 255, 255, 0.75);
            border: 1px solid #e3e5e7;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(4px);
            transition: border-radius 0.2s ease, opacity 0.2s ease;
            pointer-events: none;
            opacity: 1;
        }

        .export-ui.is-collapsed {
            width: 36.4px;
        }

        .export-ui.is-collapsed::before {
            border-radius: 18.2px;
        }

        .export-ui:not(.is-collapsed)::before {
            opacity: 0;
        }

        .export-fab {
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 36.4px;
            border-radius: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            box-shadow: none;
            backdrop-filter: none;
            cursor: pointer;
            padding: 0;
            margin: 0;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            z-index: 1;
        }

        .export-ui.is-collapsed .export-fab {
            opacity: 1;
            pointer-events: auto;
        }

        .export-fab-icon {
            width: 18px;
            height: 18px;
            display: block;
            pointer-events: none;
        }

        .export-fab:focus {
            outline: none;
        }

        /* export-ui: disabled row (used when svg+png + current zoom) */
        .export-ui .settings-item.is-disabled {
            background: rgba(93, 93, 93, 0.5);
            border-color: #aeb0b5;
        }

        .export-ui .settings-item.is-disabled .settings-item-title,
        .export-ui .settings-item.is-disabled .settings-seg button {
            color: #5f6062;
            cursor: default;
        }

        .export-ui .settings-item.is-disabled .settings-seg {
            background: rgba(123, 123, 123, 0.94);
            border-color: #aeb0b5;
        }

        /* export-ui: export-fab loading spinner (blue rounded arc) */
        .export-ui.is-loading.is-collapsed .export-fab {
            pointer-events: none;
            cursor: default;
        }

        .export-ui.is-loading.is-collapsed .export-fab::after {
            content: '';
            position: absolute;
            top: -3px;
            left: -3px;
            right: -3px;
            bottom: -3px;
            border-radius: 999px;
            border: 3px solid transparent;
            border-top-color: #3498db;
            border-right-color: #3498db;
            animation: export-btn-spinner 0.9s linear infinite;
            pointer-events: none;
        }

        @keyframes export-btn-spinner {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* ===== 全屏浏览 FAB ===== */
        .fullscreen-fab {
            position: fixed;
            top: 10px;
            right: 62px;
            width: 36.4px;
            height: 36.4px;
            border-radius: 18.2px;
            background: rgba(255, 255, 255, 0.75);
            border: 1px solid #e3e5e7;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 0;
            margin: 0;
            z-index: 8000;
            -webkit-tap-highlight-color: transparent;
            transition: opacity 0.18s ease, transform 0.18s ease;
        }

        .fullscreen-fab:hover {
            background: rgba(255, 255, 255, 0.92);
        }

        .fullscreen-fab:active {
            transform: scale(0.92);
        }

        .fullscreen-fab:focus {
            outline: none;
        }

        .fullscreen-fab-icon {
            width: 16px;
            height: 16px;
            display: block;
            pointer-events: none;
        }

        .settings-content {
            margin-top: 0;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.92);
            border-style: solid;
            border-color: #e3e5e7;
            border-width: 1px;
            box-shadow: 0 0 30px rgba(0, 0, 0, .1);
            overflow: hidden;
            opacity: 1;
            max-height: 360px;
            transition: opacity 0.2s ease, max-height 0.2s ease, margin-top 0.2s ease, border-width 0.2s ease;
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .settings-content.is-hidden {
            opacity: 0;
            max-height: 0;
            margin-top: 0;
            border-width: 0;
            pointer-events: none;
        }

        /* ===== 右侧 panel：样式隔离（panel-*） ===== */
        .panel-container {
            margin-top: 0;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.92);
            border-style: solid;
            border-color: #e3e5e7;
            border-width: 1px;
            box-shadow: 0 0 30px rgba(0, 0, 0, .1);
            overflow: hidden;
            opacity: 1;
            transition: opacity 0.2s ease;
        }

        .panel-list {
            list-style: none;
            margin: 0;
            padding: 4px 0;
            overflow-y: auto;
            overflow-x: hidden;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
        }

        .panel-list::-webkit-scrollbar {
            display: none;
        }

        .panel-popup {
            font-size: 12px;
            line-height: 1.2;
            color: #111;
        }

        .panel-name {
            font-size: 20px;
            font-weight: 700;
            white-space: nowrap;
        }

        .panel-line {
            font-size: 15px;
            font-weight: 600;
            white-space: nowrap;
            display: block;
            width: 100%;
            box-sizing: border-box;
            margin: 0;
            padding-top: 10px;
            padding-bottom: 10px;
            cursor: default;
        }

        .panel-line-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            width: 100%;
            pointer-events: none;
        }

        .panel-line-name {
            font-size: 20px;
            flex: 0 1 auto;
            display: inline-block;
            width: fit-content;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            pointer-events: auto;
            cursor: pointer;
        }

        .panel-line-name-suffix {
            font-size: 13px;
            color: #555;
            font-weight: 500;
            margin-left: 2px;
        }

        .panel-line-toggle {
            flex: 0 0 auto;
            color: #666;
            font-size: 12px;
            line-height: 1;
            padding: 2px 4px;
            user-select: none;
        }

        .panel-timetable-root {
            margin-top: 2px;
        }

        .panel-dir-header {
            margin: 6px 0 4px;
            font-size: 16px;
            font-weight: 600;
            color: #111;
            padding-top: 3px;
            padding-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            cursor: pointer;
            user-select: none;
        }

        .panel-dir-title {
            flex: 1 1 auto;
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .panel-dir-prefix,
        .panel-dir-suffix {
            flex: 0 0 auto;
            pointer-events: none;
        }

        .panel-dir-marquee {
            flex: 1 1 auto;
            min-width: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .panel-dir-marquee-inner {
            display: inline-block;
            white-space: nowrap;
            will-change: transform;
        }

        .panel-dir-triangle {
            flex: 0 0 auto;
            font-size: 14px;
            opacity: 0.75;
            pointer-events: none;
        }

        .panel-dir-actions {
            flex: 0 0 auto;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .panel-dir-filter-btn {
            width: 18px;
            height: 18px;
            border: none;
            border-radius: 6px;
            background: transparent;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex: 0 0 auto;
        }

        .panel-dir-print-btn {
            width: 18px;
            height: 18px;
            border: none;
            border-radius: 6px;
            background: transparent;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex: 0 0 auto;
        }

        .panel-dir-filter-btn:hover {
            background: #f3f7ff;
        }

        .panel-dir-print-btn:hover {
            background: #f3f7ff;
        }

        .panel-dir-filter-icon {
            width: 12px;
            height: 12px;
            display: block;
            pointer-events: none;
        }

        .panel-dir-print-icon {
            width: 12px;
            height: 12px;
            display: block;
            pointer-events: none;
        }

        .panel-timetable {
            color: #555;
            margin-top: 2px;
            margin-bottom: 8px;
            /* 与线路名左对齐：外层 .panel-company-lines .panel-line 已经有 padding-left */
            padding-left: 10px;
            touch-action: pan-y;
            overflow: hidden;
        }

        .panel-timetable.is-collapsed {
            max-height: 66px;
            overflow: hidden;
        }

        .panel-timetable.is-expanded {
            /* 展开态：显示窗口约 10 行，其余通过内部滚动查看 */
            max-height: calc(10 * 18px + 8px);
            overflow-y: auto;
            overflow-x: hidden;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-y;
            padding-top: 2px;
            padding-bottom: 2px;
        }

        .panel-timetable.is-expanded::-webkit-scrollbar {
            display: none;
        }

        .panel-timetable.panel-timetable-view-grid {
            padding-left: 0;
            margin-top: 4px;
            border-radius: 8px;
        }

        .panel-timetable.panel-timetable-view-grid.is-collapsed {
            max-height: calc(2 * 34px + 2px);
            overflow: hidden;
        }

        .panel-timetable.panel-timetable-view-grid.is-expanded {
            max-height: calc(10 * 34px + 10px);
            overflow-y: auto;
            overflow-x: hidden;
            padding-top: 0;
            padding-bottom: 0;
        }

        .panel-timetable-grid {
            display: flex;
            flex-direction: column;
        }

        .panel-grid-hints {
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding: 2px 2px 4px 2px;
            box-sizing: border-box;
        }

        .panel-grid-hint-line {
            display: flex;
            align-items: flex-start;
            gap: 4px;
            width: 100%;
            font-size: 11px;
            line-height: 1.25;
            white-space: normal;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .panel-grid-hint-label {
            flex: 0 0 auto;
            color: #666 !important;
            white-space: nowrap;
        }

        .panel-grid-hint-content {
            flex: 1 1 auto;
            min-width: 0;
            white-space: normal;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .panel-grid-hint-item {
            white-space: normal;
        }

        .panel-grid-hint-sep {
            color: #999;
        }

        .panel-grid-row {
            display: grid;
            grid-template-columns: 48px minmax(0, 1fr);
            align-items: stretch;
            min-height: 45px;
            
        }

        .panel-grid-row.is-alt-a {
            background: #f6f7f9;
        }

        .panel-grid-row.is-alt-b {
            background: #eef1f5;
        }

        .panel-grid-hour {
            width: 48px;
            min-height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            background: #3498db;
            border-bottom: 1px solid rgba(255, 255, 255, 0.9);
            user-select: none;
            box-sizing: border-box;
        }

        .panel-grid-trips {
            min-height: 34px;
            display: flex;
            flex-wrap: wrap;
            align-items: stretch;
            align-content: flex-start;
            gap: 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
        }

        .panel-grid-cell {
            min-height: 45px;
            padding: 1px 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }



        .panel-grid-cell.is-empty {
            color: transparent;
        }

        .panel-grid-cell-trip {
            flex: 0 0 20%;
            width: 20%;
            max-width: 20%;
            cursor: pointer;
        }

        .panel-grid-trip {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0;
            line-height: 1.05;
            color: #111;
        }

        .panel-grid-trip-abbr {
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
        }

        .panel-grid-trip-minute {
            font-size: 16px;
            font-weight: 700;
        }

        .panel-timetable-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            font-size: 14px;
            padding-top: 1px;
            padding-bottom: 1px;
            white-space: nowrap;
            height: 18px;
            box-sizing: border-box;
            cursor: pointer;
        }

        .panel-timetable-row.is-past {
            color: #ccc;
        }

        .panel-grid-cell-trip.is-past,
        .panel-grid-trip.is-past {
            color: #ccc !important;
        }

        .panel-timetable-empty {
            font-size: 12px;
            color: #999;
            height: 22px;
            display: flex;
            align-items: center;
        }

        .panel-timetable-dest {
            flex: 1 1 auto;
            min-width: 70px;
            display: flex;
            align-items: center;
            gap: 4px;
