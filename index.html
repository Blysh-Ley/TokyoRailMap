<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="utf-8" />
    <title>东京铁路网</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
    
    <!-- 1. 引入 MapLibre GL JS 的 CSS 和 JS -->
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    
    <style>
        :root {
            --custom-icon-font-size: 12px;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        #map {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* 隐藏滚动条 */
        body::-webkit-scrollbar {
            display: none;
        }

        .custom-button {
            background-color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
            cursor: pointer !important;
            font-size: 18px;
        }

        .custom-button:hover {
            background-color: #f0f0f0;
        }

        .video-button{
            display: none;
        }

        .custom-textbox {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: white;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 17px;
            opacity: 0;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
            z-index:9999;
        }

        .custom-icon {
            font-size: var(--custom-icon-font-size);
            background-color: rgba(255, 255, 255, 0.8);
            padding: 0px;
            border-radius: 5px;
            color: #4e4e4e;
            text-align: center;
            white-space: nowrap;
            display: inline-block;
        }

        /* 左上角搜索框（仅 UI；逻辑在 search.js） */
        .search-ui {
            position: absolute;
            top: 10px;
            left: 20px;
            z-index: 9999;
            width: 320px;
            max-width: calc(100vw - 20px);
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            user-select: none;
            /* 动画：从圆形向右展开为圆角矩形（top/left 不变） */
            transition: width 0.2s ease;
            position: absolute;
            display: grid;
            grid-template-rows: 36.4px auto;
            grid-template-columns: 1fr;
            gap: 0;
        }

        /* 顶部“外壳”：负责圆形/圆角矩形形变（避免影响结果面板背景） */
        .search-ui::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            height: 36.4px;
            width: 100%;
            border-radius: 18.2px;
            background: rgba(255, 255, 255, 0.75);
            border: 1px solid #e3e5e7;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(4px);
            transition: border-radius 0.2s ease;
            pointer-events: none;
        }

        /* 初始：圆形搜索按钮；hover/触屏点击后展开为 search-bar */
        .search-ui.is-collapsed {
            width: 36.4px;
        }

        .search-ui.is-collapsed::before {
            /* 用“高度一半”的半径，避免从超大值被浏览器 clamp 导致末尾跳变 */
            border-radius: 18.2px;
        }

        .search-ui.is-collapsed .search-results {
            opacity: 0;
            max-height: 0;
            margin-top: 0;
            border-width: 0;
            pointer-events: none;
        }

        .search-fab {
            grid-row: 1;
            grid-column: 1;
            width: 100%;
            height: 36.4px;
            border-radius: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            box-shadow: none;
            backdrop-filter: none;
            cursor: pointer;
            padding: 0;
            margin: 0;
            color: #111;
            font-size: 18px;
            line-height: 1;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            z-index: 1;
        }

        .search-ui.is-collapsed .search-fab {
            opacity: 1;
            pointer-events: auto;
        }

        .search-fab-icon {
            width: 18px;
            height: 18px;
            display: block;
            pointer-events: none;
        }

        .search-fab:focus {
            outline: none;
        }

        .search-bar {
            grid-row: 1;
            grid-column: 1;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            border-radius: 12px;
            background: transparent;
            border: none;
            box-shadow: none;
            backdrop-filter: none;
            opacity: 1;
            transition: opacity 0.2s ease;
            z-index: 1;
        }

        .search-ui.is-collapsed .search-bar {
            opacity: 0;
            pointer-events: none;
        }

        .search-input {
            width: 100%;
            border: none;
            background: transparent;
            outline: none;
            font-size: 14px;
            color: #111;
        }

        .search-input::placeholder {
            color: #666;
        }

        .search-results {
            grid-row: 2;
            grid-column: 1;
            margin-top: 8px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.92);
            border-style: solid;
            border-color: #e3e5e7;
            border-width: 1px;
            box-shadow: 0 0 30px rgba(0, 0, 0, .1);
            overflow: hidden;
            opacity: 1;
            max-height: 360px;
            transition: opacity 0.2s ease, max-height 0.2s ease, margin-top 0.2s ease, border-width 0.2s ease;
        }

        .search-results.is-hidden {
            opacity: 0;
            max-height: 0;
            margin-top: 0;
            border-width: 0;
            pointer-events: none;
        }

        .search-results-list {
            list-style: none;
            margin: 0;
            padding: 4px 0;
            max-height: 320px;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .search-results-list::-webkit-scrollbar {
            display: none;
        }

        /* ===== 右侧 panel：样式隔离（panel-*） ===== */
        .panel-container {
            margin-top: 0;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.92);
            border-style: solid;
            border-color: #e3e5e7;
            border-width: 1px;
            box-shadow: 0 0 30px rgba(0, 0, 0, .1);
            overflow: hidden;
            opacity: 1;
            transition: opacity 0.2s ease;
        }

        .panel-list {
            list-style: none;
            margin: 0;
            padding: 4px 0;
            overflow-y: auto;
            overflow-x: hidden;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
        }

        .panel-list::-webkit-scrollbar {
            display: none;
        }

        .panel-popup {
            font-size: 12px;
            line-height: 1.2;
            color: #111;
        }

        .panel-name {
            font-size: 20px;
            font-weight: 700;
            white-space: nowrap;
        }

        .panel-line {
            font-size: 15px;
            font-weight: 600;
            white-space: nowrap;
            display: block;
            width: 100%;
            box-sizing: border-box;
            margin: 0;
            padding-top: 2px;
            padding-bottom: 2px;
            cursor: default;
        }

        .panel-line-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            width: 100%;
        }

        .panel-line-name {
            flex: 1 1 auto;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .panel-line-toggle {
            flex: 0 0 auto;
            color: #666;
            font-size: 12px;
            line-height: 1;
            padding: 2px 4px;
            user-select: none;
        }

        .panel-timetable-root {
            margin-top: 2px;
        }

        .panel-dir-header {
            margin: 6px 0 4px;
            font-size: 13px;
            font-weight: 600;
            color: #111;
            padding-top: 3px;
            padding-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            cursor: pointer;
            user-select: none;
        }

        .panel-dir-title {
            flex: 1 1 auto;
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .panel-dir-prefix,
        .panel-dir-suffix {
            flex: 0 0 auto;
            pointer-events: none;
        }

        .panel-dir-marquee {
            flex: 1 1 auto;
            min-width: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .panel-dir-marquee-inner {
            display: inline-block;
            white-space: nowrap;
            will-change: transform;
        }

        .panel-dir-triangle {
            flex: 0 0 auto;
            font-size: 14px;
            opacity: 0.75;
            pointer-events: none;
        }

        .panel-timetable {
            color: #555;
            margin-top: 2px;
            margin-bottom: 8px;
            /* 与线路名左对齐：外层 .panel-company-lines .panel-line 已经有 padding-left */
            padding-left: 10px;
            touch-action: pan-y;
            overflow: hidden;
        }

        .panel-timetable.is-collapsed {
            max-height: 66px;
            overflow: hidden;
        }

        .panel-timetable.is-expanded {
            /* 展开态：显示窗口约 10 行，其余通过内部滚动查看 */
            max-height: calc(10 * 18px + 8px);
            overflow-y: auto;
            overflow-x: hidden;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-y;
            padding-top: 2px;
            padding-bottom: 2px;
        }

        .panel-timetable.is-expanded::-webkit-scrollbar {
            display: none;
        }

        .panel-timetable-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            font-size: 12px;
            padding-top: 1px;
            padding-bottom: 1px;
            white-space: nowrap;
            height: 18px;
            box-sizing: border-box;
        }

        .panel-timetable-row.is-past {
            color: #ccc;
        }

        .panel-timetable-dest {
            flex: 1 1 auto;
            min-width: 70px;
            display: flex;
            align-items: center;
            gap: 4px;
            overflow: hidden;
        }

        .panel-timetable-dest-prefix {
            flex: 0 0 auto;
            pointer-events: none;
        }

        .panel-timetable-dest-marquee {
            flex: 1 1 auto;
            min-width: 0;
            display: block;
            overflow: hidden;
            pointer-events: none;
        }

        .panel-timetable-dest-marquee-inner {
            display: inline-block;
            white-space: nowrap;
            will-change: transform;
        }

        .panel-timetable-time {
            flex: 0 0 auto;
            text-align: left;
        }

        .panel-time-label {
            min-width:38px;
            display: inline-block;
            text-align: left;
            color: #666;
            font-weight: 600;
        }

        .panel-time-label-origin {
            color: green;
        }

        .panel-time-label-terminal {
            color: red;
        }

        .panel-timetable-type {
            flex: 0 0 auto;
            text-align: right;
            min-width: 60px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .panel-time-arrive {
            color: red;
            display: inline-block;
            min-width: 38px;
            text-align: left;
            margin-right: 5px;
        }

        .panel-time-depart {
            color: green;
            display: inline-block;
            min-width: 38px;
            text-align: left;
        }

        .panel-timetable-row.is-past .panel-time-arrive,
        .panel-timetable-row.is-past .panel-time-depart {
            color: #ccc;
        }

        .panel-time-label.is-past {
            color: #ccc;
        }

        .panel-trip-detail {
            min-width: 260px;
            max-width: calc(100vw - 40px);
            max-height: 60vh;
            background: rgba(255, 255, 255, 0.96);
            border: 1px solid #e3e5e7;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0, 0, 0, .12);
            overflow: hidden;
            opacity: 1;
            transition: opacity 0.15s ease, transform 0.15s ease;
            transform: translateX(0);
            pointer-events: auto;
        }

        .panel-trip-detail.is-hidden {
            opacity: 0;
            transform: translateX(8px);
            pointer-events: none;
        }

        .panel-trip-detail-header {
            display: flex;
            align-items: center;
            padding: 8px 10px;
            border-bottom: 1px solid #e3e5e7;
        }

        .panel-trip-detail-title {
            font-size: 13px;
            font-weight: 700;
            color: #111;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .panel-trip-detail-body {
            padding: 6px 10px 8px;
            max-height: calc(60vh - 36px);
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
        }

        .panel-trip-detail-table {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .panel-trip-detail-head,
        .panel-trip-detail-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            height: 18px;
            white-space: nowrap;
        }

        .panel-trip-detail-head {
            font-weight: 600;
            color: #666;
            margin-bottom: 2px;
        }

        .panel-trip-detail-row.is-past {
            color: #ccc;
        }

        .panel-trip-detail-station {
            flex: 1 1 auto;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .panel-trip-detail-time {
            flex: 0 0 auto;
            min-width: 70px;
            text-align: left;
        }

        .panel-trip-detail-row.is-past .panel-time-arrive,
        .panel-trip-detail-row.is-past .panel-time-depart {
            color: #ccc;
        }

        .panel-trip-detail-spacer {
            height: 18px;
            flex: 0 0 auto;
        }

        /* Title multiline fallback when needed */
        [data-panel-title].is-multiline {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            white-space: normal;
            line-height: 1.05;
        }

        .panel-company {
            margin-top: 6px;
        }

        .panel-company-header {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #111;
            font-weight: 700;
            white-space: nowrap;
            cursor: default;
        }

        .panel-popup.is-interactive .panel-line,
        .panel-popup.is-interactive .panel-company-header {
            cursor: pointer;
        }

        .panel-company-logo {
            width: 20px;
            height: 20px;
            object-fit: contain;
            flex: 0 0 20px;
        }

        .panel-company-lines {
            margin-top: 4px;
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .panel-company-name {
            font-size: 18px;
        }

        .panel-company-lines .panel-line {
            padding-left: 1.7em;
        }

        /* panel：工作日/休息日切换（圆角滑块，风格对齐 station-label-toggle） */
        .panel-day-toggle {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            user-select: none;
        }

        .panel-day-seg {
            display: inline-flex;
            border: 1px solid #e3e5e7;
            border-radius: 9999px;
            overflow: hidden;
            background: #fff;
        }

        .panel-day-seg button {
            border: none;
            background: transparent;
            padding: 4px 10px;
            font-size: 13px;
            color: #111;
            cursor: pointer;
        }

        .panel-day-seg button:hover {
            background: #f0f0f0;
        }

        .panel-day-seg button.is-active {
            background: #3498db;
            color: #fff;
        }

        .search-result-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            cursor: pointer;
            color: #111;
            position: relative;
        }

            .panel-controls {
                display: flex;
                flex-direction: column;
                align-items: flex-end;
                gap: 6px;
                flex: 0 0 auto;
            }

            .panel-time-control {
                display: flex;
                align-items: center;
                gap: 6px;
            }

            .panel-time-control-label {
                font-size: 12px;
                color: #666;
                font-weight: 600;
                user-select: none;
            }

            .panel-time-input {
                font-size: 12px;
                border: 1px solid #e3e5e7;
                border-radius: 8px;
                padding: 4px 6px;
                background: rgba(255, 255, 255, 0.85);
            }

        .search-result-item:hover {
            background-color: #3498db;
            color: #fff;
        }

        .search-result-item::after {
            content: '';
            position: absolute;
            left: 12px;
            right: 12px;
            bottom: 0;
            height: 1px;
            background-color: #efefef;
        }

        .search-result-item:last-child::after {
            display: none;
        }

        .search-result-icon {
            width: 18px;
            height: 18px;
            flex: 0 0 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .search-result-icon--company {
            width: 18px;
            height: 18px;
            object-fit: contain;
        }

        .search-result-icon--line {
            width: 9px;
            height: 18px;
            border-radius: 0;
            background: #111;
        }

        .search-result-icon--station {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #fff;
            /* 默认（非换乘站）：细描边；换乘站在 search.js 里动态加粗 */
            border: 0.5px solid #333;
            box-sizing: border-box;
        }

        .search-result-text {
            font-size: 14px;
            line-height: 1.2;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .search-empty {
            padding: 10px 12px;
            color: #666;
            font-size: 13px;
        }

        .RW-wrapper {
            display: none;
            position: absolute;
            top: 200px;
            left: -190px;
            z-index: 9999;
            margin-top: 0px;
            padding-top: 20px;
            padding-bottom: 20px;
            cursor: pointer;

            /* 触屏：尽量消除浏览器默认点击/高亮反馈 */
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            touch-action: manipulation;
        }

        /* 某些浏览器把 tap-highlight 画在父层/子层：统一关闭 */
        .RW-wrapper,
        .RW-wrapper * {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }


        .RW-list {
            margin-top: 0px;
            padding-left: 1px;
            font-size: 16px;
            overflow-y: auto;
            overflow-x: hidden;
            border-radius: 8px;
            background-color: #fff;
            border: 1px solid #e3e5e7;
            box-shadow: 0 0 30px rgba(0, 0, 0, .1);
        }


        .RW-content{
            display: flex;
            min-height:40px;
            max-height:100px;
            font-size: 15px;
            flex-wrap: wrap;
            color: black;
            background-color:white;
            align-items:center;
            justify-content: space-between;
            padding: .5rem 1rem;
            position: relative;

            /* 触屏：去掉浏览器默认的点击灰色高亮/长按菜单 */
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            user-select: none;
        }

        /* 触屏按下时不出现额外反馈（保留 .RW-active 的选中态） */
        .RW-content:active {
            background-color: inherit;
        }

        .RW-content:focus,
        .RW-content:focus-visible {
            outline: none;
            box-shadow: none;
        }

        /* 选中状态 */
        .RW-item:hover > .RW-content {
            background-color: #3498db;
            color: #fff;
        }

        /* 点击后的选中态（不依赖 hover） */
        .RW-active {
            background-color: #3498db;
            color: #fff;
        }

        /* 隐藏底部线条 */
        .RW-item:hover > .RW-content::after {
            background-color: transparent;
        }

        /* 显示底部线条 */
        .RW-content::after {
            content: '';
            position: absolute;
            left: 0.5rem;
            right: 0.5rem;
            bottom: 0;
            height: 1px;
            background-color: #efefef;
        }

        /* 隐藏滚动条 */
        .RW-list::-webkit-scrollbar {
            display: none;
        }

        ul {
            list-style-type: none;
        }

        p{
            margin-top: 10px;
            margin-block-end:0px
        }

        .RW-company{
            display: block !important;
            opacity: 0.95;
            transition: left 0.3s ease-in-out;
        }

        .RW-company-list{
            min-width: 200px;
        }

        .RW-line{
            min-width: 200px;
        }

        .RW-linedirc{
            min-width: 200px;
        }

        .RW-linestation{
            min-width: 200px;
            width:max-content;
        }

        .RW-disabled{
            cursor:default !important;
            background-color: #e0e0e0
        }

        /* 公司logo：统一尺寸，保证每行高度/宽度一致 */
        .RW-company-content {
            align-items: center;
        }

        .RW-company-left {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .RW-company-name {
            text-align: left;
        }

        .RW-company-type {
            font-size: 10px;
            line-height: 1.1;
            color: #999;
            margin-top: 2px;
        }

        .RW-company-logo {
            width: 28px;
            height: 28px;
            flex: 0 0 28px;
            object-fit: contain;
        }

        .RW-company-logo--placeholder {
            display: inline-block;
        }

        /* 站名 DOM 标签（由 labels.js 创建），用于显示站点名称 */
        .station-label {
            font-size: 12px;
            line-height: 1.2;
            color: #111;
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(0, 0, 0, 0.2);
            border-radius: 3px;
            padding: 1px 4px;
            white-space: nowrap;
            pointer-events: auto;
            cursor: pointer;

            /* 触屏：去掉浏览器默认点击高亮 */
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            user-select: none;
        }

        /* 站点悬浮弹框内容（由 layers.js 写入 popup HTML） */
        .station-hover-popup {
            font-size: 12px;
            line-height: 1.2;
            color: #111;
        }

        /* popup 半透明（80%）：仅透明背景，不影响文字 */
        .maplibregl-popup-content {
            background: rgba(255, 255, 255, 0.9);
        }

        /* tip（三角箭头）也同步半透明 */
        .maplibregl-popup-anchor-top .maplibregl-popup-tip {
            border-bottom-color: rgba(255, 255, 255, 0.9);
        }
        .maplibregl-popup-anchor-bottom .maplibregl-popup-tip {
            border-top-color: rgba(255, 255, 255, 0.9);
        }
        .maplibregl-popup-anchor-left .maplibregl-popup-tip {
            border-right-color: rgba(255, 255, 255, 0.9);
        }
        .maplibregl-popup-anchor-right .maplibregl-popup-tip {
            border-left-color: rgba(255, 255, 255, 0.9);
        }

        .station-hover-name {
            font-size:20px;
            font-weight: 700;
            white-space: nowrap;
        }

        .station-hover-lines {
            margin-top: 4px;
            display: block;
            white-space: normal;
        }

        .station-hover-line {
            font-size: 15px;
            font-weight: 600;
            white-space: nowrap;
            display: block;
            width: 100%;
            box-sizing: border-box;
            margin: 0;
            padding-top: 2px;
            padding-bottom: 2px;
            cursor: default;
        }

        .station-hover-company {
            margin-top: 6px;
        }

        .station-hover-company-header {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #111;
            font-weight: 700;
            white-space: nowrap;
            cursor: default;
        }

        .station-hover-popup.is-interactive .station-hover-line,
        .station-hover-popup.is-interactive .station-hover-company-header {
            cursor: pointer;
        }

        .station-hover-company-logo {
            width: 20px;
            height: 20px;
            object-fit: contain;
            flex: 0 0 20px;
        }

        .station-hover-company-lines {
            margin-top: 4px;
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .station-hover-company-name {
            font-size: 18px;
        }

        /* 线路名称首行缩进两个字符（用 2em 近似） */
        .station-hover-company-lines .station-hover-line {
            padding-left: 1.7em;
        }

        /* 右上角：站名显示开关 */
        .station-label-toggle {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            background: #fff;
            border: 1px solid #e3e5e7;
            border-radius: 9999px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
            user-select: none;
        }

        .station-label-toggle-text {
            font-size: 14px;
            color: #111;
        }

        .station-label-seg {
            display: inline-flex;
            border: 1px solid #e3e5e7;
            border-radius: 9999px;
            overflow: hidden;
            background: #fff;
        }

        .station-label-seg button {
            border: none;
            background: transparent;
            padding: 4px 10px;
            font-size: 13px;
            color: #111;
            cursor: pointer;
        }

        .station-label-seg button:hover {
            background: #f0f0f0;
        }

        .station-label-seg button.is-active {
            background: #3498db;
            color: #fff;
        }

        /* 底部居中：当前高亮公司/线路提示 */
        .selection-badge {
            position: fixed;
            left: 50%;
            bottom: 18px;
            transform: translateX(-50%);
            z-index: 9999;
            padding: 8px 14px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.75);
            border: 1px solid #e3e5e7;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(4px);
            pointer-events: none;
            max-width: calc(100vw - 24px);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .selection-badge.is-hidden {
            display: none;
        }

        .selection-badge-text {
            font-size: 16px;
            line-height: 1.2;
            font-weight: 600;
            color: #111;
        }
    </style>
</head>
