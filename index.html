<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="utf-8" />
    <title>东京铁路图</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
    <script defer src="./vendor/japanese-holidays/japanese-holidays.min.js"></script>
    
    <!-- 1. 引入 MapLibre GL JS 的 CSS 和 JS -->
    <script defer src="./vendor/maplibre-gl/maplibre-gl.js"></script>
    <script defer src="./vendor/pmtiles/pmtiles.js"></script>
    <link href="./vendor/maplibre-gl/maplibre-gl.css" rel="stylesheet" />
    <script src="./src/config/runtimeVariant.js"></script>
    <script>
        (function () {
            var ua = String(window.navigator && window.navigator.userAgent || '');
            var platform = String(window.navigator && window.navigator.platform || '');
            var maxTouchPoints = Number(window.navigator && window.navigator.maxTouchPoints || 0);
            var isAppleMobile = /iPad|iPhone|iPod/.test(ua) || (/Mac/.test(platform) && maxTouchPoints > 1);
            if (isAppleMobile) {
                document.documentElement.setAttribute('data-native-platform', 'ios');
            }

            var mode = 'system';
            try {
                mode = String(window.localStorage.getItem('tokyorail.appearance.mode') || 'system');
            } catch (err) {
                mode = 'system';
            }
            var isDark = mode === 'dark';
            if (mode !== 'dark' && mode !== 'light') {
                try {
                    isDark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
                } catch (err) {
                    isDark = false;
                }
            }
            document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
        }());
    </script>
    
    <link rel="stylesheet" href="./src/styles/tokens.css">
    <link rel="stylesheet" href="./src/styles/app.css">
    <link rel="stylesheet" href="./src/styles/route-map.css" data-route-map-style="1">
</head>
<body>

<div id="mobile-startup-splash" class="mobile-startup-splash" aria-hidden="true">
    <img class="mobile-startup-splash-icon" src="./assets/icons/icon-android.png" alt="" decoding="async" />
</div>
<div id="map"></div>
<div id="controls"></div>
<div id="startup-timebar" class="settings-top-timebar" data-startup-lcp="1">
    <div id="startup-panel-date" class="panel-date" role="button" tabindex="0" aria-label="&#36873;&#25321;&#26085;&#26399;"></div>
</div>
<script>
    (function () {
        var dateEl = document.getElementById('startup-panel-date');
        if (!dateEl) return;
        var d = new Date();
        var mm = String(d.getMonth() + 1).padStart(2, '0');
        var dd = String(d.getDate()).padStart(2, '0');
        var day = d.getDay();
        var month = d.getMonth() + 1;
        var date = d.getDate();
        var isHoliday = false;
        try {
            isHoliday = !!(window.JapaneseHolidays && JapaneseHolidays.isHoliday(d));
        } catch (err) {
            isHoliday = false;
        }
        var isNewYearHoliday = (month === 12 && date >= 30) || (month === 1 && date <= 3);
        var dayType = (day === 0 || day === 6 || isHoliday || isNewYearHoliday) ? '\u4F11\u606F\u65E5' : '\u5DE5\u4F5C\u65E5';
        dateEl.textContent = dayType + ' ' + mm + '\u6708' + dd + '\u65E5';
    }());
</script>

<!-- 打包导出（SVG + PNG 背景） -->
<script src="./vendor/jszip/jszip.min.js"></script>

<!-- Android 原生壳导出分享适配 -->
<script type="module" src="./src/services/nativeExportShareService.js?v=tok33-hotfix-1"></script>

<!-- 导出：生成 PNG 背景 + SVG 覆盖，并打包下载 -->
<script type="module" src="./src/features/print/print.js?v=tok33-hotfix-1"></script>

<!-- 多选模式按钮 -->
<script src="./src/features/print/mul-select.js?v=tok33-hotfix-1"></script>

<!-- 导出：方向班次表 PDF -->
<script type="module" src="./src/features/print/print-timetables.js?v=tok33-hotfix-1"></script>

<!-- ES Module 入口：负责初始化地图、加载数据、添加图层与碰撞逻辑 -->
<script type="module" src="./src/app.js?v=tok33-hotfix-1"></script>

<!-- 搜索框 UI（先做 UI；交互逻辑后续补齐） -->
<script type="module" src="./src/features/search/search.js?v=tok33-hotfix-1"></script>

<!-- 行程搜索 UI（起终点双输入） -->
<script type="module" src='./src/features/search/travel-search-ui.js?v=tok33-hotfix-1'></script>

</body>
</html>
