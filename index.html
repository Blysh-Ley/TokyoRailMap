<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="utf-8" />
    <title>东京铁路网 (MapLibre + Carto底图)</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
    
    <!-- 1. 引入 MapLibre GL JS 的 CSS 和 JS -->
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    
    <style>
        :root {
            --custom-icon-font-size: 12px;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        #map {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* 隐藏滚动条 */
        body::-webkit-scrollbar {
            display: none;
        }

        .custom-button {
            background-color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
            cursor: pointer !important;
            font-size: 18px;
        }

        .custom-button:hover {
            background-color: #f0f0f0;
        }

        .video-button{
            display: none;
        }

        .custom-textbox {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: white;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 17px;
            opacity: 0;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
            z-index:9999;
        }

        .custom-icon {
            font-size: var(--custom-icon-font-size);
            background-color: rgba(255, 255, 255, 0.8);
            padding: 0px;
            border-radius: 5px;
            color: #4e4e4e;
            text-align: center;
            white-space: nowrap;
            display: inline-block;
        }

        /* 左上角搜索框（仅 UI；逻辑在 search.js） */
        .search-ui {
            position: absolute;
            top: 10px;
            left: 20px;
            z-index: 9999;
            width: 320px;
            max-width: calc(100vw - 20px);
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            user-select: none;
        }

        .search-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.75);
            border: 1px solid #e3e5e7;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(4px);
        }

        .search-input {
            width: 100%;
            border: none;
            background: transparent;
            outline: none;
            font-size: 14px;
            color: #111;
        }

        .search-input::placeholder {
            color: #666;
        }

        .search-results {
            margin-top: 8px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid #e3e5e7;
            box-shadow: 0 0 30px rgba(0, 0, 0, .1);
            overflow: hidden;
        }

        .search-results.is-hidden {
            display: none;
        }

        .search-results-list {
            list-style: none;
            margin: 0;
            padding: 4px 0;
            max-height: 320px;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .search-results-list::-webkit-scrollbar {
            display: none;
        }

        .search-result-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            cursor: pointer;
            color: #111;
            position: relative;
        }

        .search-result-item:hover {
            background-color: #3498db;
            color: #fff;
        }

        .search-result-item::after {
            content: '';
            position: absolute;
            left: 12px;
            right: 12px;
            bottom: 0;
            height: 1px;
            background-color: #efefef;
        }

        .search-result-item:last-child::after {
            display: none;
        }

        .search-result-icon {
            width: 18px;
            height: 18px;
            flex: 0 0 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .search-result-icon--company {
            width: 18px;
            height: 18px;
            object-fit: contain;
        }

        .search-result-icon--line {
            width: 9px;
            height: 18px;
            border-radius: 0;
            background: #111;
        }

        .search-result-icon--station {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #fff;
            /* 默认（非换乘站）：细描边；换乘站在 search.js 里动态加粗 */
            border: 0.5px solid #333;
            box-sizing: border-box;
        }

        .search-result-text {
            font-size: 14px;
            line-height: 1.2;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .search-empty {
            padding: 10px 12px;
            color: #666;
            font-size: 13px;
        }

        .RW-wrapper {
            display: none;
            position: absolute;
            top: 200px;
            left: -190px;
            z-index: 9999;
            margin-top: 0px;
            padding-top: 20px;
            padding-bottom: 20px;
            cursor: pointer;

            /* 触屏：尽量消除浏览器默认点击/高亮反馈 */
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            touch-action: manipulation;
        }

        /* 某些浏览器把 tap-highlight 画在父层/子层：统一关闭 */
        .RW-wrapper,
        .RW-wrapper * {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }


        .RW-list {
            margin-top: 0px;
            padding-left: 1px;
            font-size: 16px;
            overflow-y: auto;
            overflow-x: hidden;
            border-radius: 8px;
            background-color: #fff;
            border: 1px solid #e3e5e7;
            box-shadow: 0 0 30px rgba(0, 0, 0, .1);
        }


        .RW-content{
            display: flex;
            min-height:40px;
            max-height:100px;
            font-size: 15px;
            flex-wrap: wrap;
            color: black;
            background-color:white;
            align-items:center;
            justify-content: space-between;
            padding: .5rem 1rem;
            position: relative;

            /* 触屏：去掉浏览器默认的点击灰色高亮/长按菜单 */
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            user-select: none;
        }

        /* 触屏按下时不出现额外反馈（保留 .RW-active 的选中态） */
        .RW-content:active {
            background-color: inherit;
        }

        .RW-content:focus,
        .RW-content:focus-visible {
            outline: none;
            box-shadow: none;
        }

        /* 选中状态 */
        .RW-item:hover > .RW-content {
            background-color: #3498db;
            color: #fff;
        }

        /* 点击后的选中态（不依赖 hover） */
        .RW-active {
            background-color: #3498db;
            color: #fff;
        }

        /* 隐藏底部线条 */
        .RW-item:hover > .RW-content::after {
            background-color: transparent;
        }

        /* 显示底部线条 */
        .RW-content::after {
            content: '';
            position: absolute;
            left: 0.5rem;
            right: 0.5rem;
            bottom: 0;
            height: 1px;
            background-color: #efefef;
        }

        /* 隐藏滚动条 */
        .RW-list::-webkit-scrollbar {
            display: none;
        }

        ul {
            list-style-type: none;
        }

        p{
            margin-top: 10px;
            margin-block-end:0px
        }

        .RW-company{
            display: block !important;
            opacity: 0.95;
            transition: left 0.3s ease-in-out;
        }

        .RW-company-list{
            min-width: 200px;
        }

        .RW-line{
            min-width: 200px;
        }

        .RW-linedirc{
            min-width: 200px;
        }

        .RW-linestation{
            min-width: 200px;
            width:max-content;
        }

        .RW-disabled{
            cursor:default !important;
            background-color: #e0e0e0
        }

        /* 公司logo：统一尺寸，保证每行高度/宽度一致 */
        .RW-company-content {
            align-items: center;
        }

        .RW-company-left {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .RW-company-name {
            text-align: left;
        }

        .RW-company-type {
            font-size: 10px;
            line-height: 1.1;
            color: #999;
            margin-top: 2px;
        }

        .RW-company-logo {
            width: 28px;
            height: 28px;
            flex: 0 0 28px;
            object-fit: contain;
        }

        .RW-company-logo--placeholder {
            display: inline-block;
        }

        /* 站名 DOM 标签（由 labels.js 创建），用于显示站点名称 */
        .station-label {
            font-size: 12px;
            line-height: 1.2;
            color: #111;
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(0, 0, 0, 0.2);
            border-radius: 3px;
            padding: 1px 4px;
            white-space: nowrap;
            pointer-events: auto;
            cursor: pointer;

            /* 触屏：去掉浏览器默认点击高亮 */
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            user-select: none;
        }

        /* 站点悬浮弹框内容（由 layers.js 写入 popup HTML） */
        .station-hover-popup {
            font-size: 12px;
            line-height: 1.2;
            color: #111;
        }

        /* popup 半透明（80%）：仅透明背景，不影响文字 */
        .maplibregl-popup-content {
            background: rgba(255, 255, 255, 0.9);
        }

        /* tip（三角箭头）也同步半透明 */
        .maplibregl-popup-anchor-top .maplibregl-popup-tip {
            border-bottom-color: rgba(255, 255, 255, 0.9);
        }
        .maplibregl-popup-anchor-bottom .maplibregl-popup-tip {
            border-top-color: rgba(255, 255, 255, 0.9);
        }
        .maplibregl-popup-anchor-left .maplibregl-popup-tip {
            border-right-color: rgba(255, 255, 255, 0.9);
        }
        .maplibregl-popup-anchor-right .maplibregl-popup-tip {
            border-left-color: rgba(255, 255, 255, 0.9);
        }

        .station-hover-name {
            font-size:20px;
            font-weight: 700;
            white-space: nowrap;
        }

        .station-hover-lines {
            margin-top: 4px;
            display: block;
            white-space: normal;
        }

        .station-hover-line {
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
            display: block;
            width: 100%;
            box-sizing: border-box;
            margin: 0;
            padding-top: 2px;
            padding-bottom: 2px;
            cursor: default;
        }

        .station-hover-company {
            margin-top: 6px;
        }

        .station-hover-company-header {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #111;
            font-weight: 700;
            white-space: nowrap;
            cursor: default;
        }

        .station-hover-popup.is-interactive .station-hover-line,
        .station-hover-popup.is-interactive .station-hover-company-header {
            cursor: pointer;
        }

        .station-hover-company-logo {
            width: 16px;
            height: 16px;
            object-fit: contain;
            flex: 0 0 16px;
        }

        .station-hover-company-lines {
            margin-top: 4px;
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        /* 线路名称首行缩进两个字符（用 2em 近似） */
        .station-hover-company-lines .station-hover-line {
            padding-left: 2em;
        }

        /* 右上角：站名显示开关 */
        .station-label-toggle {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            background: #fff;
            border: 1px solid #e3e5e7;
            border-radius: 9999px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
            user-select: none;
        }

        .station-label-toggle-text {
            font-size: 14px;
            color: #111;
        }

        .station-label-seg {
            display: inline-flex;
            border: 1px solid #e3e5e7;
            border-radius: 9999px;
            overflow: hidden;
            background: #fff;
        }

        .station-label-seg button {
            border: none;
            background: transparent;
            padding: 4px 10px;
            font-size: 13px;
            color: #111;
            cursor: pointer;
        }

        .station-label-seg button:hover {
            background: #f0f0f0;
        }

        .station-label-seg button.is-active {
            background: #3498db;
            color: #fff;
        }

        /* 底部居中：当前高亮公司/线路提示 */
        .selection-badge {
            position: fixed;
            left: 50%;
            bottom: 18px;
            transform: translateX(-50%);
            z-index: 9999;
            padding: 8px 14px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.75);
            border: 1px solid #e3e5e7;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(4px);
            pointer-events: none;
            max-width: calc(100vw - 24px);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .selection-badge.is-hidden {
            display: none;
        }

        .selection-badge-text {
            font-size: 16px;
            line-height: 1.2;
            font-weight: 600;
            color: #111;
        }
    </style>
</head>
<body>

<div id="map"></div>
<div id="controls"></div>

<!-- ES Module 入口：负责初始化地图、加载数据、添加图层与碰撞逻辑 -->
<script type="module" src="./app.js"></script>

<!-- 搜索框 UI（先做 UI；交互逻辑后续补齐） -->
<script type="module" src="./search.js"></script>

</body>
</html>
